[build-system]
requires = ["scikit-build-core>=0.3.3", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "pysplines"
version = "0.1.0"
description = "A C++ library for B-spline computations with Python bindings"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Mario Caballero", email = "mariocaballeroyus@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
]

[tool.scikit-build]
# Scikit-build-core settings
cmake.minimum-version = "3.15"
cmake.build-type = "Release"

# Explicitly set the CMake source directory
cmake.source-dir = "."

# Install the Python module
wheel.packages = ["pysplines"]

# Install the C++ extension module into the pysplines package
wheel.install-dir = "pysplines"

[tool.scikit-build.cmake.define]
# Pass any CMake defines if needed
BUILD_TESTING = "OFF"
